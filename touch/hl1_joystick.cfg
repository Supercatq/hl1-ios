// Half-Life iOS touch layout: analog joystick to move, swipe the right half to aim.
// Coordinates are fractions of the screen (x: left->right, y: top->bottom).
// The last number on each button (1) keeps it square on any screen shape.
// Change anything in game: tap the gear button (top left) to drag/resize buttons.

touch_removeall
touch_grid_enable 0
touch_nonlinear_look 0
look_filter 0
touch_aspectratio 0
touch_pitch 90
touch_yaw 120
touch_joy_radius 1
touch_precise_amount 0.5

// --- aim: drag anywhere on the right half (invisible, sits under the buttons,
//     so you can hold Fire and keep aiming with the same finger)
touch_addbutton "look" "" "_look" 0.500 0.000 1.000 1.000 255 255 255 255 0

// --- move: analog joystick, bottom left (2048 = draw a stick thumb in the ring)
touch_addbutton "move" "gfx/touch/stick_ring" "_joy" 0.030 0.500 0.230 0.900 255 255 255 200 2048 1

// --- combat, bottom right
touch_addbutton "attack" "gfx/touch/fire" "+attack" 0.795 0.600 0.895 0.800 255 255 255 210 0 1
touch_addbutton "attack2" "gfx/touch/alt_fire" "+attack2" 0.810 0.400 0.885 0.550 255 255 255 200 0 1
touch_addbutton "jump" "gfx/touch/jump" "+jump" 0.915 0.580 0.990 0.730 255 255 255 200 0 1
touch_addbutton "duck" "gfx/touch/crouch" "+duck" 0.915 0.800 0.990 0.950 255 255 255 200 0 1
touch_addbutton "reload" "gfx/touch/reload" "+reload" 0.915 0.380 0.990 0.530 255 255 255 200 0 1
touch_addbutton "use" "gfx/touch/use" "+use" 0.690 0.700 0.765 0.850 255 255 255 200 0 1

// --- weapons, left side above the stick
touch_addbutton "invprev" "gfx/touch/prev" "invprev" 0.020 0.240 0.090 0.380 255 255 255 200 0 1
touch_addbutton "invnext" "gfx/touch/next" "invnext" 0.105 0.240 0.175 0.380 255 255 255 200 0 1
touch_addbutton "show_numbers" "gfx/touch/weapons" "exec touch_default/numbers.cfg" 0.400 0.020 0.470 0.160 255 255 255 200 0 1

// --- top bar
touch_addbutton "menu" "gfx/touch/menu" "cancelselect" 0.020 0.020 0.090 0.160 255 255 255 200 0 1
touch_addbutton "edit" "gfx/touch/settings" "touch_enableedit" 0.105 0.020 0.175 0.160 255 255 255 200 32 1
touch_addbutton "flashlight" "gfx/touch/flashlight" "impulse 100" 0.915 0.020 0.985 0.160 255 255 255 200 0 1
// single player only (16): quick save / quick load
touch_addbutton "loadquick" "gfx/touch/load" "loadquick" 0.745 0.020 0.815 0.160 255 255 255 200 16 1
touch_addbutton "savequick" "gfx/touch/save" "savequick" 0.830 0.020 0.900 0.160 255 255 255 200 16 1
// multiplayer only (8): scores, chat, spray, voice
touch_addbutton "scores" "gfx/touch/scores" "+showscores" 0.745 0.020 0.815 0.160 255 255 255 200 8 1
touch_addbutton "messagemode" "gfx/touch/chat" "messagemode" 0.830 0.020 0.900 0.160 255 255 255 200 8 1
touch_addbutton "spray" "gfx/touch/spray" "impulse 201" 0.660 0.020 0.730 0.160 255 255 255 200 8 1
touch_addbutton "voicechat" "gfx/touch/mic" "+voicerecord" 0.565 0.020 0.635 0.160 255 255 255 200 8 1
